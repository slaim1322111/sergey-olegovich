<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title description">
  <title id="title">Условия допуска к VPN</title>
  <desc id="description">Решение шлюза требует успешной MFA и подтверждённой управляемости устройства. В D22 MFA прошла, проверка устройства пропущена, шлюз выдал допуск.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10Z" fill="#276284"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="338" rx="18" fill="#f5f8fc" stroke="#cfdae7" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17283d">
    <text x="28" y="48" font-size="30" font-weight="700">Условия допуска к VPN</text>
    <text x="28" y="81" font-size="19" fill="#405975">Учебный регламент Л1 требует выполнить оба условия</text>
    <rect x="28" y="121" width="278" height="93" rx="12" fill="#ffffff" stroke="#aac1d7" stroke-width="2"/>
    <text x="167" y="157" text-anchor="middle" font-size="21" font-weight="700">Успешная MFA</text>
    <text x="167" y="183" text-anchor="middle" font-size="17" fill="#405975">Личность пользователя</text>
    <rect x="361" y="121" width="278" height="93" rx="12" fill="#ffffff" stroke="#aac1d7" stroke-width="2"/>
    <text x="500" y="157" text-anchor="middle" font-size="21" font-weight="700">Управляемое устройство</text>
    <text x="500" y="183" text-anchor="middle" font-size="17" fill="#405975">Корпоративная проверка</text>
    <rect x="694" y="121" width="278" height="93" rx="12" fill="#ffffff" stroke="#aac1d7" stroke-width="2"/>
    <text x="833" y="157" text-anchor="middle" font-size="21" font-weight="700">Допуск к VPN</text>
    <text x="833" y="183" text-anchor="middle" font-size="17" fill="#405975">Решение шлюза</text>
    <g fill="none" stroke="#276284" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M309 169 H357"/>
      <path d="M642 169 H690"/>
    </g>
    <rect x="28" y="241" width="944" height="71" rx="12" fill="#fff2de" stroke="#e2c39c" stroke-width="2"/>
    <text x="48" y="269" font-size="19" font-weight="700" fill="#754b24">Наблюдение D22</text>
    <text x="48" y="295" font-size="18" fill="#405975">MFA пройдена. Проверка устройства пропущена. VPN выдал допуск.</text>
  </g>
</svg>
