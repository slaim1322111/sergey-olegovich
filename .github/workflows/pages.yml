name: Publish presentations

on:
  push:
    branches: [main]
    paths:
      - '**/*.marp.md'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Install Marp
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/marp" @marp-team/marp-cli@4.5.1
      - name: Build HTML slides and PowerPoint downloads
        run: node site/build.mjs "$RUNNER_TEMP/marp/node_modules/@marp-team/marp-cli/marp-cli.js" _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
