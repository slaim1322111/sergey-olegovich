<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Три уровня доступа к PostgreSQL</title>
  <desc id="desc">Сначала проверяют доступность сетевого порта, затем допуск клиента к PostgreSQL, затем права роли на операции. В наблюдении F6 порт доступен, PostgreSQL отклоняет подключение.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10Z" fill="#276284"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="338" rx="18" fill="#f5f8fc" stroke="#cfdae7" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17283d">
    <text x="28" y="46" font-size="30" font-weight="700">Три уровня доступа к PostgreSQL</text>
    <text x="28" y="80" font-size="19" fill="#405975">Что фиксируют в протоколе на каждом уровне</text>

    <g fill="#ffffff" stroke="#aac1d7" stroke-width="2">
      <rect x="28" y="111" width="276" height="139" rx="12"/>
      <rect x="362" y="111" width="276" height="139" rx="12"/>
      <rect x="696" y="111" width="276" height="139" rx="12"/>
    </g>
    <g font-size="15" font-weight="700" fill="#235879" letter-spacing="1">
      <text x="46" y="140">1. СЕТЬ</text>
      <text x="380" y="140">2. ПОДКЛЮЧЕНИЕ</text>
      <text x="714" y="140">3. ОПЕРАЦИИ</text>
    </g>
    <g font-size="21" font-weight="700">
      <text x="46" y="178">Доступен ли порт?</text>
      <text x="380" y="178">Допущен ли клиент?</text>
      <text x="714" y="178">Что разрешено роли?</text>
    </g>
    <g font-size="18" fill="#405975">
      <text x="46" y="209">Соединение с TCP/5432</text>
      <text x="46" y="232">из указанной зоны.</text>
      <text x="380" y="209">Результат подключения</text>
      <text x="380" y="232">к серверу PostgreSQL.</text>
      <text x="714" y="209">Например, запись на игру</text>
      <text x="714" y="232">и чтение её ID и статуса.</text>
    </g>
    <g fill="none" stroke="#276284" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M308 180 H358"/>
      <path d="M642 180 H692"/>
    </g>

    <rect x="28" y="268" width="944" height="47" rx="10" fill="#e7f1f8"/>
    <text x="46" y="298" font-size="19" fill="#23495f"><tspan font-weight="700">Наблюдение F6.</tspan> TCP-порт доступен из зоны пользователей. PostgreSQL отклоняет подключение.</text>
  </g>
</svg>
