<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" width="1000" height="386" role="img" aria-labelledby="title desc">
  <title id="title">Маршрут заявки на игротеку</title>
  <desc id="desc">Пользователь подключается к веб-шлюзу по HTTPS на порту 443. Шлюз обращается к API на порту 8443. API подключается к PostgreSQL на порту 5432. Отдельная сеть управления обращается к серверу приложения по SSH и к PostgreSQL по TLS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10Z" fill="#276284"/>
    </marker>
    <marker id="admin-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10Z" fill="#63618f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="384" rx="18" fill="#f5f8fc" stroke="#cfdae7" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17283d">
    <text x="28" y="46" font-size="30" font-weight="700">Маршрут заявки на игротеку</text>
    <text x="28" y="80" font-size="19" fill="#405975">Целевая схема разрешённых соединений</text>

    <g fill="#ffffff" stroke="#aac1d7" stroke-width="2">
      <rect x="28" y="150" width="170" height="92" rx="12"/>
      <rect x="286" y="150" width="170" height="92" rx="12"/>
      <rect x="544" y="150" width="170" height="92" rx="12"/>
      <rect x="802" y="150" width="170" height="92" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="21" font-weight="700">
      <text x="113" y="188">Пользователь</text>
      <text x="371" y="188">Веб-шлюз</text>
      <text x="629" y="188">Приложение</text>
      <text x="887" y="188">PostgreSQL</text>
    </g>
    <g text-anchor="middle" font-size="17" fill="#405975">
      <text x="113" y="216">Запись на игротеку</text>
      <text x="371" y="216">DMZ</text>
      <text x="629" y="216">API на ALT Linux</text>
      <text x="887" y="216">Сегмент данных</text>
    </g>

    <g fill="none" stroke="#276284" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M200 196 H282"/>
      <path d="M458 196 H540"/>
      <path d="M716 196 H798"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="600" fill="#235879">
      <text x="242" y="172">F1 · 443</text>
      <text x="500" y="172">F2 · 8443</text>
      <text x="758" y="172">F3 · 5432</text>
    </g>
    <g text-anchor="middle" font-size="15" fill="#405975">
      <text x="242" y="221">HTTPS</text>
      <text x="500" y="221">HTTPS</text>
      <text x="758" y="221">TLS</text>
    </g>

    <rect x="544" y="321" width="428" height="42" rx="10" fill="#eeeefa" stroke="#b7b7d5" stroke-width="2"/>
    <text x="758" y="348" text-anchor="middle" font-size="20" font-weight="700" fill="#4b4976">Сеть управления</text>
    <g fill="none" stroke="#63618f" stroke-width="2.5" marker-end="url(#admin-arrow)">
      <path d="M629 319 V246"/>
      <path d="M887 319 V246"/>
    </g>
    <g font-size="17" font-weight="600" fill="#4b4976">
      <text x="641" y="291">F4 · SSH 22</text>
      <text x="875" y="291" text-anchor="end">F5 · TLS 5432</text>
    </g>
  </g>
</svg>
