<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" role="img" aria-labelledby="title desc">
  <title id="title">Первая доставка и идентичный повтор</title>
  <desc id="desc">Пакет А/42 при первом приёме должен создать 200 записей с квитанцией accepted. Идентичный повтор должен вернуть duplicate и создать ноль новых записей.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10Z" fill="#276284"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="342" rx="18" fill="#f5f8fc" stroke="#cfdae7" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17283d">
    <text x="28" y="47" font-size="30" font-weight="700">Первая доставка и идентичный повтор</text>
    <text x="28" y="80" font-size="19" fill="#405975">Ожидаемая обработка пакета А/42 по регламенту Л1</text>
    <rect x="28" y="109" width="424" height="135" rx="12" fill="#fff" stroke="#aac1d7" stroke-width="2"/>
    <rect x="548" y="109" width="424" height="135" rx="12" fill="#ecf5f3" stroke="#aaccc3" stroke-width="2"/>
    <g font-size="16" font-weight="700" fill="#235879">
      <text x="48" y="140">1. ПЕРВАЯ ДОСТАВКА</text>
      <text x="568" y="140">2. ИДЕНТИЧНЫЙ ПОВТОР</text>
    </g>
    <g font-size="24" font-weight="700">
      <text x="48" y="178">200 новых записей</text>
      <text x="568" y="178">0 новых записей</text>
    </g>
    <g font-size="19" fill="#405975">
      <text x="48" y="215">Квитанция accepted</text>
      <text x="568" y="215">Квитанция duplicate</text>
    </g>
    <g fill="none" stroke="#276284" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M458 175 H542"/>
    </g>
    <rect x="28" y="267" width="944" height="48" rx="10" fill="#e7f1f8"/>
    <text x="48" y="297" font-size="19" fill="#23495f">При повторе совпадают отправитель, идентификатор пакета и хеш.</text>
  </g>
</svg>
