<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc">
  <title id="title">Передача пакетов между филиалами и центром</title>
  <desc id="desc">Шлюзы филиалов А и Б обращаются к центральному приёмнику по потокам F1 и F2. Приёмник передаёт данные в CRM по F3, CRM использует PostgreSQL по F4.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10Z" fill="#276284"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="366" rx="18" fill="#f5f8fc" stroke="#cfdae7" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17283d">
    <text x="28" y="47" font-size="30" font-weight="700">Передача пакетов между филиалами и центром</text>
    <text x="28" y="80" font-size="19" fill="#405975">Целевые соединения по матрице Д2</text>
    <rect x="28" y="108" width="171" height="82" rx="12" fill="#fff" stroke="#aac1d7" stroke-width="2"/>
    <text x="113.5" y="142" text-anchor="middle" font-size="21" font-weight="700">Филиал А</text>
    <text x="113.5" y="168" text-anchor="middle" font-size="17" fill="#405975">Шлюз обмена</text>
    <rect x="28" y="225" width="171" height="82" rx="12" fill="#fff" stroke="#aac1d7" stroke-width="2"/>
    <text x="113.5" y="259" text-anchor="middle" font-size="21" font-weight="700">Филиал Б</text>
    <text x="113.5" y="285" text-anchor="middle" font-size="17" fill="#405975">Шлюз обмена</text>
    <rect x="305" y="164" width="158" height="89" rx="12" fill="#fff" stroke="#aac1d7" stroke-width="2"/>
    <text x="384" y="198" text-anchor="middle" font-size="21" font-weight="700">Приёмник</text>
    <text x="384" y="224" text-anchor="middle" font-size="17" fill="#405975">Центральная зона</text>
    <rect x="559" y="164" width="158" height="89" rx="12" fill="#fff" stroke="#aac1d7" stroke-width="2"/>
    <text x="638" y="198" text-anchor="middle" font-size="21" font-weight="700">CRM</text>
    <text x="638" y="224" text-anchor="middle" font-size="17" fill="#405975">Сервис импорта</text>
    <rect x="813" y="164" width="159" height="89" rx="12" fill="#fff" stroke="#aac1d7" stroke-width="2"/>
    <text x="892.5" y="198" text-anchor="middle" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="892.5" y="224" text-anchor="middle" font-size="17" fill="#405975">Сегмент данных</text>
    <g fill="none" stroke="#276284" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M201 148 H244 V184 H301"/>
      <path d="M201 266 H258 V231 H301"/>
      <path d="M465 207 H555"/>
      <path d="M719 207 H809"/>
    </g>
    <g text-anchor="middle" font-size="16" font-weight="700" fill="#235879">
      <text x="251" y="132">F1 · 443</text>
      <text x="251" y="292">F2 · 443</text>
      <text x="512" y="191">F3 · 443</text>
      <text x="765" y="191">F4 · 5432</text>
    </g>
    <g text-anchor="middle" font-size="16" fill="#405975">
      <text x="512" y="235">HTTPS</text>
      <text x="765" y="235">TLS</text>
    </g>
    <text x="28" y="342" font-size="18" fill="#405975">Филиалы используют mTLS. Квитанция возвращается в том же соединении.</text>
  </g>
</svg>
